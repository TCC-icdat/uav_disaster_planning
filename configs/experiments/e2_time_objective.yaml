experiment:
  id: E2
  name: time_aware_vs_distance_oriented
  variants:
    - {name: time_aware, objective_mode: weighted_delay}
    - {name: distance_oriented, objective_mode: total_travel_time}
  strategy: local
  status: template_not_run_at_scale

seed: 42
planning_travel_model: dubins
execution_travel_model: dubins
objective_mode: weighted_delay
high_priority_threshold: 7
map: {width: 100.0, height: 100.0, depot: {x: 0.0, y: 0.0, heading: 0.0}}
sar_uav: {count: 3, speed: 10.0, min_turn_radius: 5.0, max_mission_time: 500.0}
tasks:
  initial_count: 8
  dynamic_count: 8
  priority_range: [1, 10]
  service_time_range: [2.0, 6.0]
  release_time_range: [5.0, 60.0]
local_replanning:
  affected_uav_count_h: 2
  commitment_horizon: 0
  local_search_max_iterations: 100
  local_search_time_limit_sec: 0.1
